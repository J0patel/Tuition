        const [activeTab, setActiveTab] = useState('dashboard');

        const [settings, setSettings] = useState(INITIAL_SETTINGS);
        const [darkMode, setDarkMode] = useState(false);

        const showToast = (msg, type = 'success') => {
          setToast({ msg, type });
          setTimeout(() => setToast(null), 3500);
        };

        const currentStudent = useMemo(() => {
          return students.find(s => s.id === activeStudentId) || students[0];
        }, [students, activeStudentId]);

        useEffect(() => {
          if (darkMode) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        }, [darkMode]);

        const [showAddStudent, setShowAddStudent] = useState(false);
        const [showAddPayment, setShowAddPayment] = useState(false);
        const [showAddTest, setShowAddTest] = useState(false);
        const [showSendNotice, setShowSendNotice] = useState(false);
        const [selectedReceipt, setSelectedReceipt] = useState(null);
        const [showIDCard, setShowIDCard] = useState(false);

        const [payForm, setPayForm] = useState({ studentId: 1, amount: 3000, mode: 'UPI', notes: '' });

        const handleAddPaymentSubmit = (e) => {
          e.preventDefault();
          const st = students.find(s => s.id === Number(payForm.studentId));
          if (!st) return;
          const newReceipt = `REC-2026-${String(payments.length + 101).padStart(4, '0')}`;
          const newP = {
            id: Date.now(),
            receiptNumber: newReceipt,
            studentName: st.studentName,
            studentId: st.studentId,
            courseName: st.courseName,
            amount: Number(payForm.amount),
            paymentDate: new Date().toISOString().split('T')[0],
            paymentMode: payForm.mode,
            reference: `${payForm.mode}-REF-${Math.floor(1000 + Math.random()*9000)}`,
            notes: payForm.notes || 'Tuition Fee Payment'
          };
          setPayments([newP, ...payments]);
          setStudents(students.map(s => {
            if (s.id === st.id) {
              const paid = s.paidFees + Number(payForm.amount);
              const net = Math.max(0, s.totalFees - s.discountAmount);
              return {
                ...s,
                paidFees: paid,
                pendingFees: Math.max(0, net - paid)
              };
            }
            return s;
          }));
          setShowAddPayment(false);
          setSelectedReceipt(newP);
          showToast(`Payment of ₹${payForm.amount} collected! Receipt #${newReceipt} generated.`);
        };

              }`}>

              </div>
            )}

                    </button>
                  </div>

                  {role === 'Student' && (
                    <select
                      value={activeStudentId}

            <div className="flex-1 max-w-7xl w-full mx-auto flex flex-col md:flex-row pb-20 md:pb-6 p-4 sm:p-6 gap-6">
              <aside className="w-full md:w-64 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 shrink-0 rounded-2xl shadow-sm hidden md:block">
                <nav className="space-y-1">

                    <>
                      <NavBtn active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="fa-chart-pie" label="Dashboard" />
                      <NavBtn active={activeTab === 'profile'} onClick={() => setActiveTab('profile')} icon="fa-id-card" label="My Profile & ID" />
                      <NavBtn active={activeTab === 'attendance'} onClick={() => setActiveTab('attendance')} icon="fa-calendar-check" label="Attendance" />
                      <NavBtn active={activeTab === 'fees'} onClick={() => setActiveTab('fees')} icon="fa-receipt" label="Fees & Payments" />
                      <NavBtn active={activeTab === 'tests'} onClick={() => setActiveTab('tests')} icon="fa-file-signature" label="Tests & Results" />

                      <NavBtn active={activeTab === 'batches'} onClick={() => setActiveTab('batches')} icon="fa-layer-group" label="Batch Management" />
                      <NavBtn active={activeTab === 'attendance_mgr'} onClick={() => setActiveTab('attendance_mgr')} icon="fa-calendar-alt" label="Mark Attendance" />
                      <NavBtn active={activeTab === 'fees_mgr'} onClick={() => setActiveTab('fees_mgr')} icon="fa-wallet" label="Fees & Payments" />
                      <NavBtn active={activeTab === 'tests_mgr'} onClick={() => setActiveTab('tests_mgr')} icon="fa-tasks" label="Tests & Marks Entry" />
                      <NavBtn active={activeTab === 'materials_mgr'} onClick={() => setActiveTab('materials_mgr')} icon="fa-folder-open" label="Study Materials" />
                      <NavBtn active={activeTab === 'notif_mgr'} onClick={() => setActiveTab('notif_mgr')} icon="fa-paper-plane" label="Dispatch Notices" />
                      <NavBtn active={activeTab === 'reports'} onClick={() => setActiveTab('reports')} icon="fa-file-invoice" label="Reports & Export" />
                      <NavBtn active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} icon="fa-cog" label="Tuition Settings" />
                    </>
                  )}

              </aside>

              <main className="flex-1 overflow-y-auto">

                    {activeTab === 'tests' && <StudentTests student={currentStudent} results={results.filter(r => r.studentId === currentStudent.id)} tests={tests} />}

                        payments={payments}

                        onAddPayment={() => setShowAddPayment(true)}
                        onAddTest={() => setShowAddTest(true)}
                        onSendNotice={() => setShowSendNotice(true)}
                      />
                    )}
                    {activeTab === 'students' && (
                      <AdminStudents
                        students={students}
                        batches={batches}
                        onAddStudent={() => setShowAddStudent(true)}

                    {activeTab === 'batches' && <AdminBatches batches={batches} setBatches={setBatches} showToast={showToast} />}
                    {activeTab === 'attendance_mgr' && <AdminAttendance students={students} batches={batches} showToast={showToast} />}
                    {activeTab === 'fees_mgr' && <AdminFees payments={payments} students={students} onAddPayment={() => setShowAddPayment(true)} onReceipt={(p) => setSelectedReceipt(p)} />}
                    {activeTab === 'tests_mgr' && <AdminTests tests={tests} students={students} results={results} setResults={setResults} showToast={showToast} onAddTest={() => setShowAddTest(true)} />}

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {tests.map(t => (
                <div key={t.id} className="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-sm">
                  <h3 className="font-bold text-sm">{t.testName}</h3>
                  <p className="text-xs text-slate-500">Date: {t.testDate}</p>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function AdminMaterials() {
        return <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm"><h2 className="font-heading font-bold text-lg">Study Materials</h2></div>;
      }

      function AdminNotifications() {
        return <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm"><h2 className="font-heading font-bold text-lg">Notifications</h2></div>;
      }

      function AdminReports() {
        return <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm"><h2 className="font-heading font-bold text-lg">Reports & PDF Export</h2></div>;
      }

      function AdminSettings({ settings, setSettings, showToast }) {
        return (
          <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border shadow-sm space-y-4 max-w-lg">
            <h2 className="font-heading font-bold text-lg">Tuition Settings</h2>
            <div>
              <label className="font-semibold block text-xs mb-1">Tuition Academy Name</label>
              <input value={settings.tuitionName} onChange={(e) => setSettings({...settings, tuitionName: e.target.value})} className="w-full border rounded-lg p-2 text-xs bg-slate-50 dark:bg-slate-700 outline-none" />
            </div>
            <button onClick={() => showToast('Settings updated!')} className="px-4 py-2 bg-sky-600 text-white font-semibold text-xs rounded-lg shadow">Save Settings</button>
          </div>
        );
      }

      function KpiCard({ icon, color, title, value, subtitle }) {
        return (
          <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-3">
            <div className={`w-10 h-10 rounded-xl ${color} text-white flex items-center justify-center text-base shrink-0 shadow`}>
              <i className={`fas ${icon}`}></i>
            </div>
            <div>
              <p className="text-[11px] text-slate-500 font-medium">{title}</p>
              <h3 className="font-heading font-bold text-lg leading-tight text-slate-900 dark:text-white">{value}</h3>
              <p className="text-[10px] text-slate-400 mt-0.5">{subtitle}</p>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<StandaloneApp />);
    }
  </script>
</body>
</html>
